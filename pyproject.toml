[project]
name = "phase"
version = "0.3.0"
description = "Energy per token for local LLM inference, measured, with prefill and decode reported apart."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phase = "phase.cli:main"

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.32.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

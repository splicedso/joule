[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=spliced
OutputDirectory=image
CompressOutput=no

[Content]
Bootable=yes
Packages=
    linux-image-amd64
    firmware-amd-graphics
    systemd
    systemd-boot
    udev
    dbus
    iproute2
    openssh-server
    python3
    python3-venv
    curl
    ca-certificates
    pciutils
    lm-sensors
    bc
    login
Hostname=spliced-node
# read-only root; state lives on a separate partition mounted at /var/lib/spliced
KernelCommandLine=ro quiet amdgpu.ppfeaturemask=0xffffffff
RemoveFiles=/usr/share/doc /usr/share/man /usr/share/locale

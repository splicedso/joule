<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 680' width='1100' height='680'><defs><marker id='ac2410c' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#c2410c'/></marker><marker id='a1d4ed8' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1d4ed8'/></marker><marker id='a15803d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#15803d'/></marker><marker id='a64748b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#64748b'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='30' y='42' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='22' fill='#111111' text-anchor='start' font-weight='600'>Portable cluster v0: power tree</text><text x='30' y='66' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>695 W at 12 V (58 A) at full load, from one 1000 W supply; estimates until measured</text><rect x='40' y='110' width='170' height='70' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='125.0' y='139.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Mains</text><text x='125.0' y='159.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>about 772 W at the wall</text><rect x='270' y='110' width='180' height='70' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='360.0' y='139.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>12 V supply</text><text x='360.0' y='159.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>1000 W, 83 A</text><rect x='510' y='100' width='260' height='90' rx='4' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='640.0' y='139.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>12 V bus</text><text x='640.0' y='159.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>58 A: busbar or 8 AWG</text><polyline points='210,145 270,145' fill='none' stroke='#c2410c' stroke-width='2.5' marker-end='url(#ac2410c)'/><polyline points='450,145 510,145' fill='none' stroke='#c2410c' stroke-width='2.5' marker-end='url(#ac2410c)'/><polyline points='640,190 640,240 105,240 105,290' fill='none' stroke='#c2410c' stroke-width='2'/><rect x='40' y='290' width='130' height='60' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='105.0' y='314.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' fill='#111111' text-anchor='middle' font-weight='600'>e-fuse 20 A</text><text x='105.0' y='334.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>I2C monitor</text><polyline points='105,350 105,400' fill='none' stroke='#c2410c' stroke-width='2' marker-end='url(#ac2410c)'/><rect x='40' y='400' width='130' height='70' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='105.0' y='429.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='middle' font-weight='600'>Node 1</text><text x='105.0' y='449.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>165 W, 13.8 A</text><text x='105' y='495' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11'
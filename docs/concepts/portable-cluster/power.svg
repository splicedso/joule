font-size='13' fill='#111111' text-anchor='middle' font-weight='600'>Node 4</text><text x='555.0' y='449.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>165 W, 13.8 A</text><text x='555' y='495' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='400'>CPU: 12 V direct</text><text x='555' y='512' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='400'>24-pin: picoPSU</text><polyline points='640,190 640,240 705,240 705,290' fill='none' stroke='#c2410c' stroke-width='2'/><rect x='640' y='290' width='130' height='60' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='705.0' y='325.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' fill='#111111' text-anchor='middle' font-weight='600'>fuse 3 A</text><polyline points='705,350 705,400' fill='none' stroke='#c2410c' stroke-width='2' marker-end='url(#ac2410c)'/><rect x='640' y='400' width='130' height='70' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='705.0' y='429.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='middle' font-weight='600'>Switch</text><text x='705.0' y='449.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>20 W</text><polyline points='640,190 640,240 855,240 855,290' fill='none' stroke='#c2410c' stroke-width='2'/><rect x='790' y='290' width='130' height='60' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='855.0' y='325.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' fill='#111111' text-anchor='middle' font-weight='600'>fuse 2 A</text><polyline points='855,350 855,400' fill='none' stroke='#c2410c' stroke-width='2' marker-end='url(#ac2410c)'/><rect x='790' y='400' width='130' height='70' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='855.0' y='429.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='middle' font-weight='600'>Fans</text><text x='855.0' y='449.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>4 x 3 W, PWM</text><polyline points='640,190 640,240 1005,240 1005,290' fill='none' stroke='#c2410c' stroke-width='2'/><rect x='940' y='290' width='130' height='60' rx='4' fill='#ffffff' stroke='#c2410c' stroke-width='1.5'/><text x='1005.0' y='325.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' fill='#111111' text-anchor='middle' font-weight='600'>5 V / 3.3 V buck</text><polyline points='1005,350 1005,400' fill='none' stroke='#c2410c' stroke-width='2' marker-end='url(#ac2410c)'/><rect x='940' y='400' width='130' height='70' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='1005.0' y='429.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='middle' font-weight='600'>Controller</text><text x='1005.0' y='449.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>3 W</text><text x='30' y='570' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='start' font-weight='400'>Sequencing: the controller enables one node every 2 s, so their inrush does not add up.</text><text x='30' y='592' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='start' font-weight='400'>Branch wiring 16 AWG at 14 A (estimate; check against the chosen connector). Monitors report to the controller on I2C.</text><text x='30' y='614' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#c2410c' text-anchor='start' font-weight='400'>Board connectors from Framework's drawing: 24-pin ATX and 8-pin CPU (EPS), both 4.2 mm pitch, Mini-Fit Jr class.</text></svg>

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 520' width='1100' height='520'><defs><marker id='ac2410c' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#c2410c'/></marker><marker id='a1d4ed8' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1d4ed8'/></marker><marker id='a15803d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#15803d'/></marker><marker id='a64748b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#64748b'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='30' y='42' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='22' fill='#111111' text-anchor='start' font-weight='600'>Portable cluster v0: network</text><text x='30' y='66' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#6b7280' text-anchor='start' font-weight='400'>Each node's 5 Gbit Ethernet to one switch inside the case; USB4 between neighbours later</text><rect x='400' y='120' width='300' height='70' rx='4' fill='#ffffff' stroke='#1d4ed8' stroke-width='1.5'/><text x='550.0' y='149.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Switch, 5 Gbit</text><text x='550.0' y='169.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>inside the case</text><polyline points='700,155 1000,155' fill='none' stroke='#1d4ed8' stroke-width='2.5' marker-end='url(#a1d4ed8)'/><text x='850' y='145' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='12' fill='#1d4ed8' text-anchor='middle' font-weight='400'>one port to the local network</text><rect x='60' y='300' width='215' height='90' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='167.5' y='339.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Node 1</text><text x='167.5' y='359.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>5 GbE   USB4 x2</text><polyline points='167,300 167,250 550,250 550,190' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-dasharray='7,5'/><polyline points='275,345 315,345' fill='none' stroke='#64748b' stroke-width='2' stroke-dasharray='4,3'/><rect x='315' y='300' width='215' height='90' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='422.5' y='339.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Node 2</text><text x='422.5' y='359.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>5 GbE   USB4 x2</text><polyline points='422,300 422,250 550,250 550,190' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-dasharray='7,5'/><polyline points='530,345 570,345' fill='none' stroke='#64748b' stroke-width='2' stroke-dasharray='4,3'/><rect x='570' y='300' width='215' height='90' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='677.5' y='339.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Node 3</text><text x='677.5' y='359.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>5 GbE   USB4 x2</text><polyline points='677,300 677,250 550,250 550,190' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-dasharray='7,5'/><polyline points='785,345 825,345' fill='none' stroke='#64748b' stroke-width='2' stroke-dasharray='4,3'/><rect x='825' y='300' width='215' height='90' rx='4' fill='#f8fafc' stroke='#111111' stroke-width='1.5'/><text x='932.5' y='339.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='14' fill='#111111' text-anchor='middle' font-weight='600'>Node 4</text><text x='932.5' y='359.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='400'>5 GbE   USB4 x2</text><polyline points='932,300 932,250 550,250 550,190' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-dasharray='7,5'/><text x='30' y='440' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='start' font-weight='400'>Fabric (fabric/moe.py, modelled): a model split by layers spends under 1% of each token on the network, even at 10 Gbit.</text><text x='30' y='462' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='13' fill='#111111' text-anchor='start' font-weight='400'>So 5 Gbit is enough for v0. The grey links are USB4 between neighbours, for expert-parallel splits later.</text></svg>

name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.txt
      - run: gh release create "$GITHUB_REF_NAME" --title "Phase $GITHUB_REF_NAME" --notes-file notes.txt
        env:
          GH_TOKEN: ${{ github.token }}

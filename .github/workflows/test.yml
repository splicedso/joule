name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q
      - name: Every raw result file a note cites exists
        run: |
          missing=0
          for f in $(grep -hE '^Raw results' notes/*.md | grep -ohE 'results/[A-Za-z0-9_.{},*-]+\.(json|csv|txt)' | grep -v '[{*]' | sort -u); do
            [ -f "$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing
